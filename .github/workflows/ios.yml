name: Build iOS (CyIME)

# 手动触发：在 GitHub Actions 页面点 "Run workflow"。
# 不在 push 时自动运行，避免每次提交都消耗 macOS 分钟数。
on:
  workflow_dispatch:
    inputs:
      deploy_target:
        description: "IPHONEOS_DEPLOYMENT_TARGET。默认 26.0；若 Runner 尚无 iOS 26 SDK，可临时改成 18.0 先出一版能装的包。"
        default: "26.0"
        required: false
      sign:
        description: "签名并导出可安装的 IPA（需要配置 Secrets）。关闭则只做模拟器编译校验，不产出 IPA。"
        type: boolean
        default: true
      publish_release:
        description: "把 IPA + OTA 清单发布到 GitHub Release（手机 Safari 一键安装，无需 Mac）。"
        type: boolean
        default: false
      release_tag:
        description: "publish_release=true 时使用的 Release tag。"
        default: "ios-m0"
        required: false

permissions:
  contents: write

defaults:
  run:
    working-directory: ios

jobs:
  build-ios:
    name: Build / Sign IPA
    runs-on: macos-15
    timeout-minutes: 40
    env:
      SCHEME: CyIME
      DEPLOY_TARGET: ${{ github.event.inputs.deploy_target }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        # M0 纯 Swift，暂不需要递归拉 submodule；M1 集成 librime 时再开启。
        with:
          fetch-depth: 1

      - name: Select latest Xcode & show SDKs
        run: |
          XCODE_APP=$(ls -d /Applications/Xcode*.app 2>/dev/null | sort -V | tail -1)
          echo "Selected: $XCODE_APP"
          sudo xcode-select -s "$XCODE_APP"
          xcodebuild -version
          echo "--- available SDKs ---"
          xcodebuild -showsdks | grep -iE "iphoneos|iphonesimulator" || true

      - name: Install xcodegen
        run: |
          brew install xcodegen

      - name: Generate Xcode project
        run: |
          ./scripts/generate.sh
          echo "--- schemes ---"
          xcodebuild -list -project CyIME.xcodeproj

      - name: Compile check (iOS Simulator, no signing)
        run: |
          set -o pipefail
          xcodebuild build \
            -project CyIME.xcodeproj \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            IPHONEOS_DEPLOYMENT_TARGET="$DEPLOY_TARGET" \
            CODE_SIGNING_ALLOWED=NO \
            2>&1 | tail -60

      - name: Setup signing (p12 + profiles)
        if: inputs.sign
        env:
          IOS_P12_BASE64: ${{ secrets.IOS_P12_BASE64 }}
          IOS_P12_PASSWORD: ${{ secrets.IOS_P12_PASSWORD }}
          IOS_PROFILE_APP_BASE64: ${{ secrets.IOS_PROFILE_APP_BASE64 }}
          IOS_PROFILE_KEYBOARD_BASE64: ${{ secrets.IOS_PROFILE_KEYBOARD_BASE64 }}
        run: |
          chmod +x scripts/ci-signing.sh
          ./scripts/ci-signing.sh

      - name: Archive (unsigned)
        if: inputs.sign
        run: |
          set -o pipefail
          rm -rf build
          xcodebuild archive \
            -project CyIME.xcodeproj \
            -scheme "$SCHEME" \
            -configuration Release \
            -archivePath build/CyIME.xcarchive \
            -destination 'generic/platform=iOS' \
            IPHONEOS_DEPLOYMENT_TARGET="$DEPLOY_TARGET" \
            CODE_SIGNING_ALLOWED=NO \
            2>&1 | tail -40

      - name: Write ExportOptions.plist
        if: inputs.sign
        env:
          IOS_TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
          PROFILE_APP_NAME: ${{ env.PROFILE_APP_NAME }}
          PROFILE_KEYBOARD_NAME: ${{ env.PROFILE_KEYBOARD_NAME }}
        run: |
          : "${IOS_TEAM_ID:?Missing secret IOS_TEAM_ID}"
          : "${PROFILE_APP_NAME:?PROFILE_APP_NAME not set by ci-signing.sh}"
          : "${PROFILE_KEYBOARD_NAME:?PROFILE_KEYBOARD_NAME not set by ci-signing.sh}"
          mkdir -p build
          cat > build/ExportOptions.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>enterprise</string>
            <key>teamID</key><string>${IOS_TEAM_ID}</string>
            <key>signingStyle</key><string>manual</string>
            <key>stripSwiftSymbols</key><true/>
            <key>uploadSymbols</key><false/>
            <key>provisioningProfiles</key>
            <dict>
              <key>com.cyletix.cyime</key><string>${PROFILE_APP_NAME}</string>
              <key>com.cyletix.cyime.keyboard</key><string>${PROFILE_KEYBOARD_NAME}</string>
            </dict>
          </dict>
          </plist>
          EOF
          echo "--- ExportOptions.plist ---"
          cat build/ExportOptions.plist

      - name: Export signed IPA
        if: inputs.sign
        run: |
          set -o pipefail
          mkdir -p build/export
          xcodebuild -exportArchive \
            -archivePath build/CyIME.xcarchive \
            -exportOptionsPlist build/ExportOptions.plist \
            -exportPath build/export \
            2>&1 | tail -40
          echo "--- exported files ---"
          ls -la build/export

      - name: Generate OTA manifest.plist
        if: inputs.sign && inputs.publish_release
        env:
          REPO: ${{ github.repository }}
          TAG: ${{ github.event.inputs.release_tag }}
        run: |
          mkdir -p build
          IPA_URL="https://github.com/${REPO}/releases/download/${TAG}/CyIME.ipa"
          cat > build/manifest.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>items</key>
            <array>
              <dict>
                <key>assets</key>
                <array>
                  <dict>
                    <key>kind</key><string>software-package</string>
                    <key>url</key><string>${IPA_URL}</string>
                  </dict>
                </array>
                <key>metadata</key>
                <dict>
                  <key>bundle-identifier</key><string>com.cyletix.cyime</string>
                  <key>bundle-version</key><string>0.1.0</string>
                  <key>kind</key><string>software</string>
                  <key>title</key><string>CyIME</string>
                </dict>
              </dict>
            </array>
          </dict>
          </plist>
          EOF
          echo "IPA_URL=$IPA_URL"

      - name: Upload IPA artifact
        if: inputs.sign
        uses: actions/upload-artifact@v4
        with:
          name: CyIME-ipa
          path: ios/build/export/*.ipa
          if-no-files-found: error

      - name: Publish GitHub Release (OTA install)
        if: inputs.sign && inputs.publish_release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.release_tag }}
          name: CyIME iOS ${{ github.event.inputs.release_tag }}
          files: |
            ios/build/export/CyIME.ipa
            ios/build/manifest.plist
          generate_release_notes: true
