name: Build unsigned iOS IPA

# 在 macOS runner 上：编译 librime 原生静态库 -> xcodegen -> 无签名 IPA。
# 不需要任何 Secret / 证书；产物下载后用自己的证书（Feather / 3uTools）手动签名安装。
# 手动触发：Actions 页面 -> Run workflow。
on:
  workflow_dispatch:
    inputs:
      deploy_target:
        description: "IPHONEOS_DEPLOYMENT_TARGET（默认 26.0）"
        default: "26.0"
        required: false

permissions:
  contents: read

jobs:
  build:
    name: Unsigned IPA
    runs-on: macos-15
    timeout-minutes: 90
    env:
      DEPLOY_TARGET: ${{ github.event.inputs.deploy_target }}

    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v7
        with:
          # librime / snappy / lua / octagram / predict / rime-wubi 都是 submodule
          submodules: recursive
          fetch-depth: 1

      - name: Select latest Xcode
        run: |
          XCODE_APP=$(ls -d /Applications/Xcode*.app 2>/dev/null | sort -V | tail -1)
          echo "Selected: $XCODE_APP"
          sudo xcode-select -s "$XCODE_APP"
          xcodebuild -version
          xcodebuild -showsdks | grep -i iphoneos || true

      - name: Cache Boost source
        uses: actions/cache@v4
        with:
          path: app/src/main/jni/boost-1.89.0.tar.xz
          key: boost-1.89.0-cmake-tar

      - name: Install xcodegen
        run: |
          if ! command -v xcodegen >/dev/null 2>&1; then brew install xcodegen; fi
          xcodegen --version

      - name: Build librime static library
        working-directory: ios
        run: |
          chmod +x scripts/build-native.sh
          ./scripts/build-native.sh

      - name: Verify static library
        working-directory: ios
        run: |
          lipo -info native/lib/libCyIMERime.a
          echo "--- rime public symbols ---"
          nm -gU native/lib/libCyIMERime.a 2>/dev/null | grep -E "rime_get_api|rime_setup" | head -5 || true
          if ! lipo -info native/lib/libCyIMERime.a | grep -q arm64; then
            echo "错误: 静态库不含 arm64"; exit 1
          fi

      - name: Build unsigned IPA
        working-directory: ios
        run: |
          chmod +x scripts/build-unsigned-ipa.sh
          ./scripts/build-unsigned-ipa.sh

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: CyIME-unsigned-ipa
          path: ios/build/CyIME-unsigned.ipa
          if-no-files-found: error
