name: CyIME

options:
  bundleIdPrefix: com.cyletix
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    IPHONEOS_DEPLOYMENT_TARGET: "26.0"
    TARGETED_DEVICE_FAMILY: "1"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ""
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_STRICT_CONCURRENCY: minimal
    CLANG_ENABLE_MODULES: YES
    # Rime 桥接：让 Swift 访问 Obj-C++ 的 RimeBridge。
    SWIFT_OBJC_BRIDGING_HEADER: CyIME/Rime/CyIME-Bridging-Header.h
    # RimeBridge.mm 需要 librime 的公开头 rime_api.h。
    CLANG_CXX_LANGUAGE_STANDARD: c++17
    HEADER_SEARCH_PATHS:
      - $(inherited)
      - $(SRCROOT)/../app/src/main/jni/librime/src
      - $(SRCROOT)/../app/src/main/jni/librime/include
    # librime 静态库（由 ios/scripts/build-native.sh 产出）。
    # -force_load 确保 RIME_REGISTER_MODULE 的静态构造器不被链接器裁掉。
    LIBRARY_SEARCH_PATHS:
      - $(inherited)
      - $(SRCROOT)/native/lib
    OTHER_LDFLAGS:
      - $(inherited)
      - -force_load
      - $(SRCROOT)/native/lib/libCyIMERime.a
      - -lc++
      - -lz

targets:
  CyIME:
    type: application
    platform: iOS
    sources:
      - path: CyIME/App
        excludes:
          - Info.plist
          - CyIME.entitlements
      - path: CyIME/Shared
      - path: CyIME/Rime
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.cyletix.cyime
        PRODUCT_NAME: CyIME
        INFOPLIST_FILE: CyIME/App/Info.plist
        CODE_SIGN_ENTITLEMENTS: CyIME/App/CyIME.entitlements
        GENERATE_INFOPLIST_FILE: NO
        APPLICATION_EXTENSION_API_ONLY: NO
    dependencies:
      - target: CyIMEKeyboard
        embed: true

  CyIMEKeyboard:
    type: app-extension
    platform: iOS
    sources:
      - path: CyIME/Keyboard
        excludes:
          - Info.plist
          - CyIMEKeyboard.entitlements
      - path: CyIME/Shared
      - path: CyIME/Rime
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.cyletix.cyime.keyboard
        PRODUCT_NAME: CyIMEKeyboard
        INFOPLIST_FILE: CyIME/Keyboard/Info.plist
        CODE_SIGN_ENTITLEMENTS: CyIME/Keyboard/CyIMEKeyboard.entitlements
        GENERATE_INFOPLIST_FILE: NO
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
